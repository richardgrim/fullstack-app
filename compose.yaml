name: reservas-lab
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - reservas-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reservas -d reservas']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  reservas-data:
